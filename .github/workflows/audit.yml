name: Audit

# Checks the lock files against the RustSec advisory database: weekly, because advisories
# arrive without any change here, and whenever a lock file changes. Vulnerabilities fail
# the run; unmaintained and unsound warnings are reported without failing it.
on:
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches: [main]
    paths: ["**/Cargo.lock", .github/workflows/audit.yml]
  pull_request:
    paths: ["**/Cargo.lock", .github/workflows/audit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-audit@0.22.2
      # Called directly rather than through cargo, which would install the pinned toolchain
      # only to dispatch the subcommand.
      - name: Workspace
        run: cargo-audit audit
      - name: Patched gjson
        run: cargo-audit audit --file vendor/gjson/Cargo.lock
