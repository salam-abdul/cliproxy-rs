name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Allocation ceilings use one pinned compiler. Re-measure when it changes.
  RUST_TOOLCHAIN: "1.99.0"
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # No debug info in test builds: linking about 55 test binaries with full debug info
      # was most of a warm build (18 GB in target/debug/deps). Panic messages keep their
      # file and line. Only for the test and lint jobs: rust-cache keys its caches on
      # CARGO_* variables, and the other jobs keep theirs.
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148
      # The store tests start a private PostgreSQL cluster from these binaries.
      - name: PostgreSQL server binaries
        run: |
          newest() { find /usr/lib/postgresql -mindepth 2 -maxdepth 2 -name bin -type d 2>/dev/null | sort -V | tail -n 1; }
          bin=$(newest)
          if [ -z "$bin" ] || [ ! -x "$bin/initdb" ]; then
            sudo apt-get install -y --no-install-recommends postgresql
            bin=$(newest)
          fi
          "$bin/initdb" --version
          echo "CPA_TEST_PG_BIN=$bin" >> "$GITHUB_ENV"
      - name: Fetch dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path vendor/gjson/Cargo.toml
      - name: Test, with external network denied
        # Nextest runs the test binaries in parallel; .config/nextest.toml runs the memory
        # gate (crates/cpa-server/tests/alloc_budget.rs) and the tests with wall-clock
        # bounds alone. Nextest skips doc tests, so cargo test runs those, then the tests
        # of the patched gjson in vendor/, which is outside the workspace.
        run: |
          .github/scripts/offline.sh '
            cargo nextest run --workspace --locked --profile ci 2>&1 | tee test.log
            cargo test --workspace --doc --locked 2>&1 | tee -a test.log
            cargo test --locked --manifest-path vendor/gjson/Cargo.toml --target-dir target 2>&1 | tee -a test.log
          '
      - name: Test counts
        if: ${{ !cancelled() && hashFiles('test.log') != '' }}
        # Nextest's summary line and cargo test's result lines; nextest counts an ignored
        # test as skipped.
        run: |
          sed 's/\x1b\[[0-9;]*m//g' test.log | awk '
            /^test result:/ { passed += $4; failed += $6; ignored += $8 }
            /^ *Summary \[/ {
              for (i = 2; i <= NF; i++) {
                word = $i; sub(/,$/, "", word)
                if (word == "passed") passed += $(i - 1)
                else if (word == "failed") failed += $(i - 1)
                else if (word == "skipped") ignored += $(i - 1)
              }
            }
            END { printf "%d passed, %d failed, %d ignored\n", passed, failed, ignored }'

  # Everything that does not need the test build: formatting, clippy over every target,
  # and the Codex Live media relay tests, which build cpa-server with its optional
  # media-relay feature.
  lint:
    name: fmt, clippy and media relay tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt,clippy
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148
      - name: Format
        run: cargo fmt --all --check
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Clippy
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Media relay tests, with external network denied
        # All of cpa-server's unit tests run with the feature on, the ones behind it included.
        run: .github/scripts/offline.sh 'cargo nextest run -p cpa-server --features media-relay --lib --locked --profile ci'

  # Clippy over every target with warnings as errors, so code that only builds on Windows,
  # test-only code included, is held to the Linux rules. Checking only, no codegen or link.
  windows:
    name: clippy (Windows)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          target: x86_64-pc-windows-msvc
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings

  # The native routing wire tests drive the built binary and the router fixture over
  # loopback with a throwaway certificate authority.
  native:
    name: native routing (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.8.2"
      - name: Build
        run: cargo build --locked -p cliproxy --bin cliproxy -p cpa-server --example native_router_fixture
      - name: Wire tests, with external network denied
        run: .github/scripts/offline.sh 'python3 native/test.py'

  dashboard:
    name: dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.8.2"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - name: Type check, unit tests and build
        run: npm run check && npm test && npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Browser checks
        run: node scripts/dashboard-check.mjs && DASHBOARD_KIND=rust node scripts/dashboard-check.mjs
      - name: Checked-in assets match the source
        run: git diff --exit-code -- dist
