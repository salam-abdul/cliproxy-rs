name: Native Claude routing
on:
  push:
    paths: ["native/**", "crates/**", "Cargo.*", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", "crates/**", "Cargo.*", ".github/workflows/native.yml"]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev perl
      - run: rustup toolchain install 1.99.0 --profile minimal && rustup default 1.99.0
      - uses: actions/setup-node@v7
        with:
          node-version: "26.8.2"
      - run: cargo build -p cliproxy --bin cliproxy -p cpa-server --example native_router_fixture
      - run: cargo test -p cpa-server native_claude --lib
      - run: python3 native/test.py
