# Memory soak: bound peak memory and growth under large requests.
name: soak

on:
  schedule:
    - cron: "41 2 * * 6"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes of load (at most 330)
        default: "60"
      mix:
        description: Load, claude or field
        default: field

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # One exact compiler for every job: the size and allocation budgets are exact numbers
  # from one compiler and std. Bumping it means re-measuring bench/budgets.txt.
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          MINUTES: ${{ inputs.minutes }}
          MIX: ${{ inputs.mix }}
        run: |
          case $EVENT in
            schedule) runs='[{"mix":"field","minutes":300}]' ;;
            *)
              [[ $MINUTES =~ ^[1-9][0-9]{0,2}$ ]] || { echo "::error::minutes must be a positive whole number"; exit 1; }
              (( MINUTES <= 330 )) || MINUTES=330
              [[ $MIX == claude || $MIX == field ]] || { echo "::error::mix must be claude or field"; exit 1; }
              runs=$(jq -cn --arg mix "$MIX" --argjson m "$MINUTES" '[{mix: $mix, minutes: $m}]') ;;
          esac
          matrix=$runs
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  soak:
    name: soak (${{ matrix.mix }}, ${{ matrix.minutes }} min)
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake clang libclang-dev perl
      - name: Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: Build
        run: |
          cargo build --release --locked -p cliproxy
          echo "BIN=target/release/cliproxy" >> "$GITHUB_ENV"
      - name: Soak
        env:
          MIX: ${{ matrix.mix }}
          MINUTES: ${{ matrix.minutes }}
        run: |
          go build -o soak/bin/messages bench/messages/main.go
          bench/soak.sh "$BIN" "$MINUTES" soak
      - name: Summary
        if: always()
        run: |
          [[ -f soak/summary.json ]] || exit 0
          { echo "### Soak: ${{ matrix.mix }}, ${{ matrix.minutes }} min"
            echo '```json'; jq . soak/summary.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: soak-${{ matrix.mix }}
          path: |
            soak/soak.tsv
            soak/samples.tsv
            soak/batches.jsonl
            soak/summary.json
            soak/server.log
